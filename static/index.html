<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏢 크리에이터 에이전트 사무실</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b25; --panel2: #1f2330; --border: #2a2e3d;
    --text: #e8eaf2; --dim: #8a8fa3; --accent: #7c6cf2; --user: #2b3046; --ok: #3ddc84;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 800; flex: 1; }
  header .model { font-size: 11.5px; color: var(--dim); }
  header button {
    background: none; border: 1px solid var(--border); color: var(--dim);
    border-radius: 8px; padding: 6px 11px; font-size: 12px; cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  /* 4분할 레이아웃: 왼쪽 사무실 + 오른쪽 4단 */
  #grid {
    flex: 1; display: grid; gap: 12px; padding: 12px;
    grid-template-columns: 1.35fr 1fr;
    grid-template-rows: 1fr; min-height: 0;
  }
  .col-right {
    display: grid; gap: 12px; min-height: 0;
    grid-template-rows: 0.85fr 1.1fr 0.85fr 1.2fr;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .card > h2 {
    font-size: 12.5px; font-weight: 700; color: var(--dim);
    padding: 10px 14px 8px; flex-shrink: 0; letter-spacing: .02em;
  }
  .card > .body { flex: 1; overflow-y: auto; padding: 0 14px 12px; min-height: 0; }

  /* === 사무실 (왼쪽) === */
  #office { background: linear-gradient(165deg, #191d2b, #12141d); }
  #officeFloor {
    flex: 1; display: grid; gap: 14px; padding: 14px; min-height: 0;
    grid-template-columns: 1fr 1fr; align-content: center;
  }
  .desk {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 12px; text-align: center; cursor: pointer; position: relative;
    transition: border-color .15s, transform .15s;
  }
  .desk:hover { border-color: var(--accent); }
  .desk.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,108,242,.35); }
  .desk.working { animation: deskGlow 1s ease-in-out infinite; }
  @keyframes deskGlow {
    0%,100% { box-shadow: 0 0 0 2px rgba(61,220,132,.15); }
    50% { box-shadow: 0 0 0 3px rgba(61,220,132,.5); }
  }
  .desk .ava { font-size: 40px; line-height: 1; display: inline-block; }
  .desk.working .ava { animation: work .45s ease-in-out infinite; }
  @keyframes work {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-4px) rotate(5deg) scale(1.1); }
  }
  .desk:not(.working) .ava { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .desk .nm { font-size: 13px; font-weight: 700; margin-top: 6px; }
  .desk .st { font-size: 11px; color: var(--dim); margin-top: 3px; min-height: 14px; }
  .desk .badge {
    position: absolute; top: 8px; right: 10px; font-size: 9px; padding: 2px 6px;
    border-radius: 6px; background: var(--ok); color: #06210f; font-weight: 800; display: none;
  }
  .desk.working .badge { display: block; }

  /* === 스킬 리스트 === */
  .skill-group { margin-bottom: 10px; }
  .skill-group .gh { font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-size: 10.5px; padding: 3px 9px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip .x { color: var(--dim); cursor: pointer; font-weight: 700; }
  .chip .x:hover { color: #e05555; }
  .chip.add { cursor: pointer; border-style: dashed; color: var(--dim); }
  .chip.add:hover { color: var(--accent); border-color: var(--accent); }
  .skill-group .gh { display: flex; align-items: center; gap: 6px; }
  .skill-group .gh .del {
    margin-left: auto; font-size: 10px; color: var(--dim); cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px;
  }
  .skill-group .gh .del:hover { color: #e05555; border-color: #e05555; }
  .addAgentBtn {
    width: 100%; margin-bottom: 10px; padding: 7px; font-size: 12px; font-weight: 700;
    background: var(--panel2); border: 1px dashed var(--border); color: var(--accent);
    border-radius: 9px; cursor: pointer;
  }
  .addAgentBtn:hover { border-color: var(--accent); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  .field textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
  .field.row2 { display: flex; gap: 10px; }
  .field.row2 > div { flex: 1; }
  .field.row2 .emoji { flex: 0 0 70px; }

  /* === 결과물 === */
  .out {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; margin-bottom: 8px; cursor: pointer;
  }
  .out:hover { border-color: var(--accent); }
  .out .oh { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; }
  .out .ot { color: var(--dim); font-size: 10px; margin-left: auto; font-weight: 400; }
  .out .op { font-size: 11px; color: var(--dim); margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { font-size: 11.5px; color: var(--dim); padding: 6px 2px; }

  /* === 역할 분담 === */
  .role { display: flex; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .role:last-child { border: none; }
  .role .re { font-size: 22px; }
  .role .rn { font-size: 12.5px; font-weight: 700; }
  .role .rd { font-size: 11px; color: var(--dim); margin-top: 2px; line-height: 1.4; }

  /* === 채팅/지시창 === */
  #chatCard .body { padding: 8px 12px; }
  .msg { margin-bottom: 8px; font-size: 12.5px; line-height: 1.55; }
  .msg.user { text-align: right; }
  .msg .bub {
    display: inline-block; max-width: 92%; padding: 7px 11px; border-radius: 11px;
    white-space: pre-wrap; word-break: break-word; text-align: left;
  }
  .msg.user .bub { background: var(--user); }
  .msg.assistant .bub { background: var(--panel2); border: 1px solid var(--border); }
  .msg .who { font-size: 10px; color: var(--dim); margin-bottom: 2px; }
  .bub.typing::after { content: "▌"; color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #composer { display: flex; gap: 8px; padding: 8px 12px 10px; border-top: 1px solid var(--border); flex-shrink: 0; }
  #activeTag {
    font-size: 11px; color: var(--accent); padding: 8px 0 2px 12px; flex-shrink: 0;
  }
  #input {
    flex: 1; resize: none; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
    font-size: 12.5px; font-family: inherit; line-height: 1.5; max-height: 110px;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  #send {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 0 18px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  #send:disabled { opacity: .45; cursor: default; }

  /* 모달 */
  #modal, #outModal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
    align-items: center; justify-content: center; z-index: 10;
  }
  .modalBox {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    width: min(640px, 92vw); max-height: 86vh; overflow-y: auto; padding: 22px;
  }
  .modalBox h2 { font-size: 15px; margin-bottom: 6px; }
  .modalBox p { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
  .modalBox textarea {
    width: 100%; min-height: 120px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px;
    font-size: 13px; font-family: inherit; line-height: 1.6; margin-bottom: 16px; resize: vertical;
  }
  .modalBox .out-full { font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
  .modalActions { display: flex; gap: 10px; justify-content: flex-end; }
  .modalActions button { border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; border: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--border); color: var(--text); }

  @media (max-width: 760px) {
    #grid { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow-y: auto; }
    body { overflow: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>🏢 크리에이터 에이전트 사무실</h1>
  <span class="model" id="model"></span>
  <button id="memBtn">🧠 메모리</button>
  <button id="resetBtn">🗑 초기화</button>
</header>

<div id="grid">
  <!-- 왼쪽: 사무실 -->
  <div class="card" id="office">
    <h2>🏢 AI 에이전트가 일하는 사무실 — 클릭해서 담당자 선택</h2>
    <div id="officeFloor"></div>
  </div>

  <!-- 오른쪽 4단 -->
  <div class="col-right">
    <div class="card">
      <h2>📚 학습한 Skill list</h2>
      <div class="body" id="skillBody"></div>
    </div>
    <div class="card">
      <h2>📦 작업이 끝난 결과물</h2>
      <div class="body" id="outBody"><div class="empty">아직 결과물이 없어요. 지시를 내려보세요.</div></div>
    </div>
    <div class="card">
      <h2>🧩 각각의 에이전트 업무 분담</h2>
      <div class="body" id="roleBody"></div>
    </div>
    <div class="card" id="chatCard">
      <h2>💬 AI 지시창 (LLM)</h2>
      <div id="activeTag"></div>
      <div class="body" id="chat"></div>
      <div id="composer">
        <textarea id="input" rows="1" placeholder="담당자에게 지시…  (Enter 전송)"></textarea>
        <button id="send">전송</button>
      </div>
    </div>
  </div>
</div>

<!-- 메모리 모달 -->
<div id="modal">
  <div class="modalBox">
    <h2>👤 프로필</h2>
    <p>나/채널 정보 — 모든 에이전트가 매 작업에 참고합니다.</p>
    <textarea id="profileTa"></textarea>
    <h2>🧠 장기 메모리</h2>
    <p>"기억해:" 명령으로 쌓이는 노트 — 직접 수정·삭제도 가능합니다.</p>
    <textarea id="memTa"></textarea>
    <div class="modalActions">
      <button class="btn-ghost" id="closeMem">닫기</button>
      <button class="btn-primary" id="saveMem">저장</button>
    </div>
  </div>
</div>

<!-- 에이전트 추가/편집 모달 -->
<div id="agentModal">
  <div class="modalBox">
    <h2 id="agentModalTitle">에이전트 추가</h2>
    <div class="field row2">
      <div class="emoji"><label>이모지</label><input id="agEmoji" maxlength="4" placeholder="🧑"></div>
      <div><label>이름</label><input id="agName" placeholder="예: 디자이너"></div>
    </div>
    <div class="field"><label>역할 (업무 분담 설명)</label>
      <input id="agRole" placeholder="예: 썸네일·그래픽 디자인을 담당합니다."></div>
    <div class="field"><label>역할 프롬프트 (이 직원에게 주는 지침)</label>
      <textarea id="agPrompt" placeholder="예: 당신은 디자이너입니다. 썸네일 시안과 그래픽 가이드를 제안하세요."></textarea></div>
    <div class="field"><label>스킬 (쉼표로 구분)</label>
      <input id="agSkills" placeholder="예: 썸네일, 색감, 타이포그래피"></div>
    <div class="modalActions">
      <button class="btn-ghost" id="closeAgent">취소</button>
      <button class="btn-primary" id="saveAgent">저장</button>
    </div>
  </div>
</div>

<!-- 결과물 상세 모달 -->
<div id="outModal">
  <div class="modalBox">
    <h2 id="outModalTitle"></h2>
    <p id="outModalMeta"></p>
    <div class="out-full" id="outModalBody"></div>
    <div class="modalActions" style="margin-top:16px">
      <button class="btn-ghost" id="closeOut">닫기</button>
      <button class="btn-primary" id="copyOut">📋 복사</button>
    </div>
  </div>
</div>

<script>
let AGENTS = [], BY_ID = {}, active = null;
const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), sendBtn = $("send");

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers, { "X-Password": localStorage.getItem("agent_pw") || "" });
  let res = await fetch(path, opts);
  if (res.status === 401) {
    const pw = prompt("🔒 비밀번호를 입력하세요");
    if (pw === null) return res;
    localStorage.setItem("agent_pw", pw);
    opts.headers["X-Password"] = pw;
    res = await fetch(path, opts);
  }
  return res;
}

// ---------- 사무실 렌더 ----------
function renderOffice() {
  const floor = $("officeFloor");
  floor.innerHTML = "";
  AGENTS.forEach(a => {
    const d = document.createElement("div");
    d.className = "desk" + (a.id === active ? " active" : "");
    d.id = "desk-" + a.id;
    d.innerHTML = `<span class="badge">작업중</span>
      <span class="ava">${a.emoji}</span>
      <div class="nm">${a.name}</div>
      <div class="st" id="st-${a.id}">대기 중</div>`;
    d.onclick = () => setActive(a.id);
    floor.appendChild(d);
  });
}
function setActive(id) {
  active = id;
  document.querySelectorAll(".desk").forEach(d => d.classList.remove("active"));
  $("desk-" + id)?.classList.add("active");
  $("activeTag").textContent = "▶ 현재 담당: " + BY_ID[id].emoji + " " + BY_ID[id].name;
}

// ---------- 스킬 / 역할 렌더 ----------
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderSkills() {
  const body = $("skillBody");
  body.innerHTML = `<button class="addAgentBtn" id="addAgentBtn">➕ 에이전트 추가</button>` +
    AGENTS.map((a, ai) => `
    <div class="skill-group">
      <div class="gh">${a.emoji} ${esc(a.name)}
        <span class="del" data-edit="${ai}">✎ 편집</span>
        <span class="del" data-delagent="${ai}">🗑</span></div>
      <div class="chips">
        ${a.skills.map((s, si) => `<span class="chip">${esc(s)}<span class="x" data-da="${ai}" data-ds="${si}">✕</span></span>`).join("")}
        <span class="chip add" data-addskill="${ai}">＋ 스킬 학습</span>
      </div>
    </div>`).join("");

  body.querySelector("#addAgentBtn").onclick = () => openAgentModal(null);
  body.querySelectorAll("[data-edit]").forEach(el => el.onclick = () => openAgentModal(+el.dataset.edit));
  body.querySelectorAll("[data-delagent]").forEach(el => el.onclick = () => {
    const a = AGENTS[+el.dataset.delagent];
    if (AGENTS.length <= 1) return alert("에이전트는 최소 1명 필요해요.");
    if (confirm(`'${a.name}' 에이전트를 삭제할까요?`)) {
      AGENTS.splice(+el.dataset.delagent, 1); saveAgents();
    }
  });
  body.querySelectorAll("[data-addskill]").forEach(el => el.onclick = () => {
    const s = prompt("학습시킬 스킬 이름을 입력하세요");
    if (s && s.trim()) { AGENTS[+el.dataset.addskill].skills.push(s.trim()); saveAgents(); }
  });
  body.querySelectorAll(".chip .x").forEach(el => el.onclick = () => {
    AGENTS[+el.dataset.da].skills.splice(+el.dataset.ds, 1); saveAgents();
  });
}

async function saveAgents() {
  try {
    const res = await api("/agents", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agents: AGENTS })
    });
    const d = await res.json();
    if (d.error) return alert(d.error);
    AGENTS = d.agents; BY_ID = {}; AGENTS.forEach(a => BY_ID[a.id] = a);
    if (!BY_ID[active]) active = AGENTS[0]?.id;
    renderOffice(); renderSkills(); renderRoles(); if (active) setActive(active);
  } catch (e) { alert("저장 실패 — 서버 연결을 확인하세요."); }
}

let editIdx = null;
function openAgentModal(idx) {
  editIdx = idx;
  const a = idx === null ? { emoji: "🧑", name: "", role: "", prompt: "", skills: [] } : AGENTS[idx];
  $("agentModalTitle").textContent = idx === null ? "에이전트 추가" : "에이전트 편집";
  $("agEmoji").value = a.emoji; $("agName").value = a.name;
  $("agRole").value = a.role; $("agPrompt").value = a.prompt;
  $("agSkills").value = a.skills.join(", ");
  $("agentModal").style.display = "flex";
  $("agName").focus();
}
function renderRoles() {
  $("roleBody").innerHTML = AGENTS.map(a => `
    <div class="role">
      <span class="re">${a.emoji}</span>
      <div><div class="rn">${a.name}</div><div class="rd">${a.role}</div></div>
    </div>`).join("");
}

// ---------- 결과물 ----------
let outputs = [];
function renderOutputs() {
  const body = $("outBody");
  if (!outputs.length) { body.innerHTML = `<div class="empty">아직 결과물이 없어요. 지시를 내려보세요.</div>`; return; }
  body.innerHTML = outputs.map((o, i) => {
    const a = BY_ID[o.agent] || { emoji: "📄", name: "" };
    return `<div class="out" data-i="${i}">
      <div class="oh">${a.emoji} ${o.title}<span class="ot">${o.ts}</span></div>
      <div class="op">${o.content.replace(/</g,"&lt;")}</div></div>`;
  }).join("");
  body.querySelectorAll(".out").forEach(el =>
    el.onclick = () => openOutput(outputs[+el.dataset.i]));
}
async function loadOutputs() {
  try { outputs = (await (await api("/outputs")).json()).outputs || []; renderOutputs(); } catch (e) {}
}
function openOutput(o) {
  const a = BY_ID[o.agent] || { emoji: "📄", name: "" };
  $("outModalTitle").textContent = a.emoji + " " + o.title;
  $("outModalMeta").textContent = a.name + " · " + o.ts;
  $("outModalBody").textContent = o.content;
  $("outModal").style.display = "flex";
  $("copyOut").onclick = () => { navigator.clipboard.writeText(o.content); $("copyOut").textContent = "✅ 복사됨"; };
}

// ---------- 채팅 ----------
function addMsg(role, text, agentId) {
  const m = document.createElement("div");
  m.className = "msg " + role;
  const who = role === "assistant" && agentId && BY_ID[agentId]
    ? `<div class="who">${BY_ID[agentId].emoji} ${BY_ID[agentId].name}</div>` : "";
  m.innerHTML = who + `<div class="bub"></div>`;
  m.querySelector(".bub").textContent = text;
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return m.querySelector(".bub");
}

// 사무실 상태 제어
const FR = ["🤔", "✍️", "⚡", "📝", "💡"];
let work = { id: null, timer: null, start: 0, chars: 0, f: 0 };
function startWork(id) {
  work = { id, timer: null, start: Date.now(), chars: 0, f: 0 };
  const desk = $("desk-" + id);
  desk?.classList.add("working");
  const ava = desk?.querySelector(".ava");
  work.timer = setInterval(() => {
    work.f = (work.f + 1) % FR.length;
    if (ava) ava.textContent = FR[work.f];
    const sec = Math.floor((Date.now() - work.start) / 1000);
    const st = $("st-" + id); if (st) st.textContent = `⏱${sec}초 · ${work.chars}자`;
  }, 350);
}
function endWork(id, ok) {
  clearInterval(work.timer);
  const desk = $("desk-" + id);
  desk?.classList.remove("working");
  const ava = desk?.querySelector(".ava");
  if (ava) ava.textContent = BY_ID[id].emoji;
  const sec = Math.max(1, Math.round((Date.now() - work.start) / 1000));
  const st = $("st-" + id);
  if (st) st.textContent = ok ? `😎 ${sec}초·${work.chars}자 완료` : "😵 오류";
  setTimeout(() => { if (st && !desk.classList.contains("working")) st.textContent = "대기 중"; }, 4000);
}

async function send() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  const id = active;
  input.value = ""; input.style.height = "auto";
  addMsg("user", text);
  sendBtn.disabled = true;
  const bubble = addMsg("assistant", "", id);
  bubble.classList.add("typing");
  startWork(id);
  let ok = true;
  try {
    const res = await api("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, agent: id })
    });
    const reader = res.body.getReader(), dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const piece = dec.decode(value, { stream: true });
      bubble.textContent += piece; work.chars += piece.length;
      chat.scrollTop = chat.scrollHeight;
    }
    if (bubble.textContent.startsWith("⚠️")) ok = false;
  } catch (e) {
    bubble.textContent += "\n⚠️ 서버 연결이 끊겼습니다."; ok = false;
  }
  bubble.classList.remove("typing");
  endWork(id, ok);
  sendBtn.disabled = false; input.focus();
  if (ok && !text.startsWith("기억해")) loadOutputs();
}

sendBtn.onclick = send;
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 110) + "px";
});

// 메모리 모달
$("memBtn").onclick = async () => {
  const d = await (await api("/memory")).json();
  $("profileTa").value = d.profile || ""; $("memTa").value = d.memories || "";
  $("modal").style.display = "flex";
};
$("closeMem").onclick = () => $("modal").style.display = "none";
$("saveMem").onclick = async () => {
  await api("/memory", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ profile: $("profileTa").value, memories: $("memTa").value }) });
  $("modal").style.display = "none";
};
$("closeOut").onclick = () => $("outModal").style.display = "none";
$("closeAgent").onclick = () => $("agentModal").style.display = "none";
$("saveAgent").onclick = () => {
  const name = $("agName").value.trim();
  if (!name) return alert("이름을 입력하세요.");
  const data = {
    emoji: $("agEmoji").value.trim() || "🧑",
    name,
    role: $("agRole").value.trim(),
    prompt: $("agPrompt").value.trim(),
    skills: $("agSkills").value.split(",").map(s => s.trim()).filter(Boolean),
  };
  if (editIdx === null) AGENTS.push(data);
  else Object.assign(AGENTS[editIdx], data);
  $("agentModal").style.display = "none";
  saveAgents();
};
$("resetBtn").onclick = async () => {
  if (!confirm("대화와 결과물을 초기화할까요? (기록은 memory/archive/에 보관됩니다)")) return;
  await api("/reset", { method: "POST" });
  chat.innerHTML = ""; outputs = []; renderOutputs(); loadHistory();
};

async function loadHistory() {
  try {
    const data = await (await api("/history")).json();
    (data.messages || []).forEach(m => {
      if (m.role === "user") addMsg("user", m.content);
      else if (m.role === "assistant") addMsg("assistant", m.content, m.agent);
    });
  } catch (e) {}
}

async function init() {
  try {
    const d = await (await api("/agents")).json();
    AGENTS = d.agents || []; BY_ID = {}; AGENTS.forEach(a => BY_ID[a.id] = a);
    $("model").textContent = d.model || "";
    active = AGENTS[0]?.id;
    renderOffice(); renderSkills(); renderRoles();
    if (active) setActive(active);
    await loadHistory(); await loadOutputs();
    if (!chat.children.length)
      addMsg("assistant", "안녕하세요! 🏢 사무실에 오신 걸 환영해요.\n오른쪽 사무실에서 담당자를 클릭하고, 아래에 지시를 내려보세요.\n결과물은 자동으로 위 '결과물' 창에 쌓입니다.", active);
  } catch (e) {}
  input.focus();
}
init();
</script>
